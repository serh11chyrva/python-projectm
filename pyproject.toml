[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "python-projectm"
version = "1.0.0"
description = "Python bindings for ProjectM (OpenGL music visualizer)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "serh11chyrva", email = "serhiichyrva@hotmail.com" }]

requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Visualization",
    "Topic :: Multimedia :: Graphics :: OpenGL",
]

dependencies = ["numpy>=2.0,<3.0", "PyOpenGL>=3.1.10,<4.0.0"]


[project.optional-dependencies]
pyside6 = ["PySide6>=6.10.1"]

glfw = ["glfw>=2.10.0,<3.0.0"]


[project.urls]
Homepage = "https://github.com/serh11chyrva/python-projectm"
Repository = "https://github.com/serh11chyrva/python-projectm"
Issues = "https://github.com/serh11chyrva/python-projectm/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["python_projectm", "python_projectm.*"]


[tool.setuptools.package-data]
python_projectm = ["*.dll", "*.so", "*.dylib"]
