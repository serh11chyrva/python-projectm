name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  attach:
    name: Attach wheels and corresponding sources
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-sources
          path: release-assets
      - name: Attach the exact verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          sha256sum *.whl *.tar.gz > SHA256SUMS
          gh release upload "$RELEASE_TAG" *.whl *.tar.gz SHA256SUMS --clobber

  publish:
    name: Publish verified wheels to PyPI
    needs: attach
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/python-projectm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/
