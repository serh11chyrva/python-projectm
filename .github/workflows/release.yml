name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-projectm-pypi
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version and commit
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable version and existing tag
        id: metadata
        shell: python
        run: |
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Expected a stable release version, got {version!r}')
          tag = f'v{version}'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              if os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Run manual publication from the main branch.')
          else:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              if event['release']['tag_name'] != tag:
                  raise SystemExit(f'The release tag must match {tag}')
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
              raise SystemExit(f'{tag} already points to another commit; release tags are never overwritten.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  attach:
    name: Attach wheels and corresponding sources
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-windows
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-sources
          path: release-assets
      - name: Attach the exact verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          fi
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*-py3-none-win_amd64.whl' | wc -l)" -eq 1
          sha256sum *.whl *.tar.gz > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release upload "$RELEASE_TAG" *.whl *.tar.gz SHA256SUMS --clobber

  publish:
    name: Publish verified wheels to PyPI
    needs: attach
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/python-projectm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-windows
          path: dist
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/
          verbose: true
